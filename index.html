const { createPerformance } = __modules["js/performance.js"];
const { mountLevel } = __modules["js/levels.js"];
const { createInvitationData } = __modules["js/invitation-data.js"];
const { drawInvitation, exportPng } = __modules["js/invitation.js"];
const { scenes, sceneArt, particles } = __modules["js/visuals.js"];
const app = document.querySelector('#app');
const dialog = document.querySelector('#image-dialog');
const game = createGame(questions);
document.querySelector('#brand-name').textContent = event.projectName;
document.title = `${event.projectName}｜${event.projectSubtitle}`;
let imageUrl;
let screenVersion = 0;
const $ = selector => app.querySelector(selector);
const text = (selector, value) => { $(selector).textContent = value; };
let transitionTimer;
let cleanupLevel = () => {};
const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function screen(html, name = 'home') {
  cleanupLevel(); cleanupLevel = () => {};
  clearTimeout(transitionTimer); screenVersion++; document.body.dataset.scene = name;
  app.innerHTML = html; app.focus(); window.scrollTo(0, 0);
}
function home() {
  game.reset();
  if (imageUrl) { URL.revokeObjectURL(imageUrl); imageUrl = undefined; }
  dialog.close(); document.querySelector('#export-image').removeAttribute('src');
  screen(`<section class="home-page"><div class="home-hero"><div class="home-copy"><p class="eyebrow"><span class="mini-star">✦</span> 2026 PROGRAMMER'S DAY</p><h1><span class="home-logo">1024<span>.exe</span></span><span id="project-subtitle"></span></h1><p id="event-theme" class="theme-line"></p><p class="home-intro">你的日常，是别人的生存挑战。</p><form id="start-form" novalidate><div class="form-heading"><label for="name">PLAYER NAME <span>/ 玩家姓名</span></label><span>01 PLAYER</span></div><input id="name" autocomplete="name" maxlength="80" placeholder="输入你的名字，开启1024挑战" aria-describedby="name-error privacy" required><p id="name-error" class="error" role="alert"></p><button class="primary start-button" type="submit"><span>START GAME</span><span aria-hidden="true">→</span></button><p class="play-time">◷ 约 3 分钟 <span>完成 5 项挑战 · 解锁专属邀请函</span></p></form><p id="privacy" class="privacy"></p></div><div class="portal-scene"><div class="scene-window-bar"><span>WORLD_1024 / NEW ADVENTURE</span><span>■ ■ ×</span></div><img src="${__scenes["portal.svg"]}" alt="巨型1024像素传送门，连接彩色天空与数字道路"><div class="portal-label">YOUR NEXT ADVENTURE<br><b>STARTS HERE.</b></div><span class="floating-code code-one" aria-hidden="true">&lt;HELLO WORLD /&gt;</span><span class="floating-code code-two" aria-hidden="true">+1024 XP</span></div></div><section class="mission-preview" aria-label="五项挑战预告"><div class="section-label"><span>YOUR MISSIONS</span><span>5 个关卡，找到你的隐藏属性</span></div><div class="mission-list">${questions.map((q, i) => `<div class="mission-mini"><b>0${i + 1}</b><span id="mission-${i}"></span><span aria-hidden="true">${scenes[q.type].icon}</span></div>`).join('')}</div></section></section>`);
  text('#project-subtitle', event.projectSubtitle); text('#event-theme', event.theme); text('#privacy', messages.privacy);
  questions.forEach((q, i) => text(`#mission-${i}`, q.title));
  $('#start-form').addEventListener('submit', e => {
    e.preventDefault();
    if (!game.start($('#name').value)) {
      text('#name-error', messages.nameError); $('#name').setAttribute('aria-invalid', 'true'); $('#name').focus(); return;
    }
    const button = $('#start-form button'); button.disabled = true; button.firstElementChild.textContent = 'LOADING...';
    $('.home-page').classList.add('launching');
    if (reducedMotion()) challenge(); else transitionTimer = setTimeout(challenge, 500);
  });
}
function challenge() {
  const state = game.snapshot;
  if (!state.name || state.finished) return;
  const q = questions[state.level];
  const art = q.type === 'choice' || q.type === 'ending' ? sceneArt(q.type) : '';
  const special = q.type === 'choice'
    ? `${art}<div class="confidence" aria-label="AI信心"><span>AI CONFIDENCE</span><strong id="confidence-value">100%</strong><div class="confidence-bar"></div></div>`
    : q.type === 'logs' ? '<div class="incident-banner"><span class="incident-lamp"></span><strong id="incident-state">INCIDENT</strong></div>' : art;
  screen(`<section class="challenge-page play-page level-${q.type}"><div class="quest-top"><p>LEVEL ${String(state.level + 1).padStart(2, '0')} / ${String(questions.length).padStart(2, '0')}</p><div class="mission-steps" aria-hidden="true">${questions.map((_, i) => `<span class="${i < state.level ? 'done' : i === state.level ? 'current' : ''}">${i < state.level ? '✓' : `0${i + 1}`}</span>`).join('')}</div><span id="player" class="sr-only"></span></div><div class="game-heading"><h1 id="question-title"></h1>${['scanner','chat','logs'].includes(q.type) ? `<img class="scene-stamp" src="${__scenes[scenes[q.type].file]}" alt="" aria-hidden="true">` : ''}</div><div class="game-stage">${special}<div class="scene-conversation"><p id="story" class="story"></p>${q.type === 'chat' ? '<p id="intro-followup" class="story intro-followup" hidden></p>' : ''}</div><h2 id="prompt"></h2><div id="interaction"></div><div id="feedback" role="status" aria-live="polite" aria-atomic="true"></div><div id="reveal" hidden></div><button id="repair" class="primary" hidden>立即修复 →</button><button id="skip-show" class="secondary" hidden>跳过演出</button><button id="next" class="primary" hidden>${q.type === 'ending' ? '领取我的邀请函' : 'NEXT LEVEL →'}</button></div><button class="restart text-button">← 重新开始</button></section>`, q.type);
  text('#player', state.name); text('#question-title', q.title); text('#story', q.story); text('#prompt', q.prompt);
  const root = $('.challenge-page');
  const performance = createPerformance();
  let ready = false, introTimer, showIntro = () => {};
  let previousRetry = -1;
  const reveal = $('#reveal');
  const add = (tag, content, className) => {
    const el = document.createElement(tag); el.textContent = content; if (className) el.className = className;
    reveal.hidden = false; reveal.append(el); return el;
  };
  const feedback = (value, correct) => {
    $('#feedback').className = correct ? 'feedback correct' : 'feedback retry'; text('#feedback', value);
  };
  const complete = () => {
    ready = true; root.classList.remove('performing'); root.classList.add('level-passed');
    $('#skip-show').hidden = true; $('#next').hidden = false;
  };
  const play = (steps, duration) => {
    root.classList.add('performing'); $('#skip-show').hidden = false;
    performance.play(steps, duration, complete);
  };
  const burst = () => $('.game-stage').insertAdjacentHTML('beforeend', particles());
  if (q.type === 'chat') {
    text('#intro-followup', q.introFollowUp);
    showIntro = () => { clearTimeout(introTimer); $('#intro-followup').hidden = false; };
    if (reducedMotion()) showIntro(); else introTimer = setTimeout(showIntro, 450);
  }
  const setConfidence = value => {
    text('#confidence-value', `${value}%`); $('.confidence-bar').style.width = `${value}%`;
  };
  const view = mountLevel($('#interaction'), q, answer => {
    const result = game.answer(answer);
    if (!result.accepted) return;
    if (!result.correct) {
      // Random first line, then choose another so retries never repeat the same quip.
      const lines = Array.isArray(q.retry) ? q.retry : [q.retry];
      const choices = lines.map((_, i) => i).filter(i => i !== previousRetry);
      previousRetry = choices[Math.floor(Math.random() * choices.length)] ?? 0;
      feedback(lines[previousRetry], false); return;
    }
    view.pass(answer); reveal.className = 'reveal';
    if (q.type === 'scanner') {
      feedback(q.success, true); add('p', q.comparison, 'unicode-comparison'); add('p', q.explanation, 'explanation');
      root.classList.add('bug-found'); play([[0, burst]], 850);
    } else if (q.type === 'choice') {
      feedback(q.answerFound, true);
      const steps = [[0, () => root.classList.add('ai-frozen')]];
      for (let i = 1; i <= 10; i++) steps.push([200 + i * 80, () => setConfidence(100 - i * 10)]);
      steps.push([1050, () => root.classList.add('ai-exposed')], [1300, () => feedback(q.success, true)], [1650, () => {
        add('strong', q.verified, 'verified');
        const detail = add('details', '', 'technical-note');
        const summary = document.createElement('summary'); summary.textContent = '为什么是 Promise？';
        const explanation = document.createElement('p'); explanation.textContent = q.explanation; detail.append(summary, explanation);

    } else if (q.type === 'chat') {
      showIntro(); $('#feedback').textContent = ''; $('#feedback').className = '';
      add('p', q.options[answer], 'player-message');
      const steps = q.followUps.map((line, i) => [250 + i * 400, () => add('p', `PM：${line}`, 'follow-up chat-message')]);
      steps.push([1450, () => { add('p', q.bonus, 'requirements-bonus'); feedback(q.success, true); }]);
      play(steps, 2100);
    } else if (q.type === 'logs') {
      feedback(q.success, true); $('#repair').hidden = false;
    } else {
      root.classList.add('destiny-chosen'); feedback(result.ending.feedback, true);
      play([[700, () => { add('p', '称号已解锁！', 'title-unlocked'); add('h2', result.ending.title, 'earned-title'); burst(); }]], 1700);
    }
  });
  $('#repair').addEventListener('click', () => {
    if (!game.repair()) return;
    $('#repair').hidden = true;
    play([[0, () => add('p', q.recovery[0], 'recovery config-repair')], [550, () => {
      root.classList.add('repaired'); text('#incident-state', 'SERVICE RECOVERED');

  });

  $('#next').addEventListener('click', () => {
    if (!ready || !game.advance()) return;
    game.snapshot.finished ? invitation() : challenge();
  });
  $('.restart').addEventListener('click', home);
  cleanupLevel = () => { clearTimeout(introTimer); performance.cancel(); view.dispose?.(); };
}

function success() {
  if (!game.snapshot.finished) return;
  screen(`<section class="success-page">${particles()}<p class="eyebrow victory-step step-one">ALL MISSIONS COMPLETED</p><div class="reward-art"><div class="reward-rays"></div><img src="${__scenes["medal.svg"]}" alt="金色像素成就勋章"></div><p class="granted victory-step step-two" id="granted"></p><p id="winner"></p><h2 id="earned-title" class="victory-step step-three"></h2><h1 id="complete" class="victory-step step-four"></h1><p class="victory-step step-four">你已获得传说级奖励，下一场冒险在线下。</p><button id="view-invite" class="primary">跳过动画 · 查看邀请函 →</button><button class="restart text-button">重新开始</button></section>`, 'success');
  text('#granted', messages.unlocked); text('#complete', messages.complete);
  text('#winner', game.snapshot.name); text('#earned-title', game.snapshot.title);
  $('#view-invite').addEventListener('click', invitation); $('.restart').addEventListener('click', home);
  if (!reducedMotion()) transitionTimer = setTimeout(invitation, 4600);
}

async function invitation() {
  if (!game.snapshot.finished) return;
  const data = createInvitationData(event, game.snapshot);
  screen(`<section class="invitation-page"><div class="invitation-actions"><div class="invitation-intro"><p class="eyebrow">传说级限定通关卡</p><h1>这份高光，<br><span>只属于你。</span></h1><p id="invite-theme" class="invite-theme"></p><div class="player-achievement"><span>本次通关成就</span><p id="invite-name"></p><h2 id="invite-title"></h2></div><p id="invite-location" class="invite-location"></p></div><section class="save-reminder" aria-labelledby="save-reminder-title"><span class="ticket-icon" aria-hidden="true">↓</span><h2 id="save-reminder-title"></h2><p id="save-reminder-body"></p><button id="save" class="primary" disabled></button><p id="save-error" class="error" role="alert"></p><p class="save-hint">高清 PNG · 下载或打开原图后长按保存</p><div class="invite-links"><button id="regenerate" class="secondary" disabled>↻ 重新生成</button><button id="restart" class="text-button">← 重新挑战</button></div></section></div><div class="pass-stage"><canvas id="invitation" role="img"></canvas></div></section>`, 'invitation');
  text('#invite-theme', data.theme); text('#invite-name', data.name); text('#invite-title', data.playerTitle);
  text('#invite-location', `活动地点：${data.location}`);
  text('#save-reminder-title', invitationSave.title); text('#save-reminder-body', invitationSave.body); text('#save', invitationSave.button);
  const canvas = $('#invitation');
  canvas.setAttribute('aria-label', `${data.name}，${data.playerTitle}。${data.title}，${data.theme}，${data.date}，${data.activity}，${data.location}。`);
  const version = screenVersion;
  const render = async () => {
    await document.fonts.load('20px Arcade1024'); await document.fonts.ready;
    if (version !== screenVersion) return;
    drawInvitation(canvas, data); $('#save').disabled = false; $('#regenerate').disabled = false;
  };
  $('#regenerate').addEventListener('click', async () => {
    $('#regenerate').disabled = true; text('#save-error', '');
    try { await render(); } catch (e) { if (version === screenVersion) text('#save-error', e.message); }
  });
  $('#save').addEventListener('click', async () => {
    const button = $('#save'); button.disabled = true; text('#save-error', '');
    try {
      const blob = await exportPng(canvas);
      if (version !== screenVersion) return;
      if (imageUrl) URL.revokeObjectURL(imageUrl);
      imageUrl = URL.createObjectURL(blob);
      const img = document.querySelector('#export-image'); img.src = imageUrl; img.alt = canvas.getAttribute('aria-label');
      document.querySelector('#download-image').href = imageUrl; document.querySelector('#open-image').href = imageUrl;
      dialog.showModal();
    } catch (e) { if (version === screenVersion) text('#save-error', `${messages.saveError} ${e.message}`); }
    finally { if (version === screenVersion) button.disabled = false; }
  });
  $('#restart').addEventListener('click', home);
  try { await render(); } catch (e) { if (version === screenVersion) text('#save-error', e.message); }
}
document.querySelector('#close-dialog').addEventListener('click', () => dialog.close());
home();

return {};
})();
document.querySelector(".brand").href=location.pathname;
})();
</script>
